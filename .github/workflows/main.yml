name: Build Qt Library (Qt 5.14.2, GCC 11.4)

on:
  push:
      branches:
      - main
  pull_request:
      branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Install Qt -------------------------------------------------------
      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 5.14.2
          host: linux
          target: desktop
          arch: gcc_64
          modules: ""

      # ---- Install GCC 11 ---------------------------------------------------
      - name: Install GCC 11
        run: |
          sudo apt update
          sudo apt install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 50
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 50
          
      # ---- Build using qmake ------------------------------------------------
      - name: Run qmake
        run: |
          qmake mira-core.pro -spec linux-g++ CONFIG+=qtquickcompiler
      - name: Compile
        run: |
          make -f Makefile qmake_all
          make -j$(nproc)

      # ---- Copy output library (.so / .a) ----------------------------------
      - name: Copy generated library
        run: |
          mkdir -p output
          cp lib*.so output/ || true
          cp lib*.a output/  || true

      # ---- Copy public headers ----------------------------------------------
      - name: Copy headers to include/
        run: |
          mkdir -p output/include
          # Add YOUR PUBLIC HEADERS HERE:
          cp -r src/cpp/* output/include/
          rm -r output/include/test/ || true
          rm -r output/include/*.pri || true
          rm -r output/include/*.cpp || true
          rm -r output/include/**/*.cpp || true
          rm -r output/include/**/**/*.cpp || true
          rm -r output/include/**/**/**/*.cpp || true

      # ---- Generate .pri file -----------------------------------------------
      - name: Generate PRI file
        run: |
          cat > output/mira-core.pri << EOF
          # Auto-generated by CI

          allFilesFolders = $$files(\$\$$PWD/include/*, true)
          folders = \$\$PWD/include
          for (item, allFilesFolders) {
              contains(item, [^.]*) {
                  base = $$basename(item)
                  !equals(base, qmldir) {
                      folders += $$item
                  }
              }
          }
          INCLUDEPATH += $$folders
          INCLUDEPATH = $$unique(INCLUDEPATH)
          
          LIBS += -L\$\$PWD/lib -lmira-core
          EOF

      # ---- Upload artifacts --------------------------------------------------
      - name: Upload Library Package
        uses: actions/upload-artifact@v4
        with:
          name: mira-core-gcc11.4-qt5.14.2
          path: output/
