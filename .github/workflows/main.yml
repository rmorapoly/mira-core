name: Build Qt Library (Qt 5.14.2, GCC 11.4)

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Install Qt -------------------------------------------------------
      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v3
        with:
          version: 5.14.2
          host: linux
          target: desktop
          arch: gcc_64
          modules: ""

      # ---- Install GCC 11 ---------------------------------------------------
      - name: Install GCC 11
        run: |
          sudo apt update
          sudo apt install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 50
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 50

      # ---- Build using qmake ------------------------------------------------
      - name: Run qmake
        run: |
          qmake mira-core.pro
      - name: Compile
        run: |
          make -j$(nproc)

      # ---- Copy output library (.so / .a) ----------------------------------
      - name: Create lib output folder
        run: mkdir -p output/lib

      - name: Copy generated library
        run: |
          cp lib*.so output/lib/ || true
          cp lib*.a output/lib/  || true

      # ---- Copy public headers ----------------------------------------------
      - name: Copy headers to include/
        run: |
          mkdir -p output/include
          # Add YOUR PUBLIC HEADERS HERE:
          cp -r src/cpp/*.h output/include/
          cp -r src/cpp/**/*.h output/include/ || true

      # ---- Generate .pri file -----------------------------------------------
      - name: Generate PRI file
        run: |
          cat > output/mira-core.pri << EOF
          # Auto-generated by CI
          INCLUDEPATH += \$\$PWD/include
          LIBS += -L\$\$PWD/lib -lmira-core
          EOF

      # ---- Upload artifacts --------------------------------------------------
      - name: Upload Library Package
        uses: actions/upload-artifact@v4
        with:
          name: mira-core-gcc11.4-qt5.14.2
          path: output/
